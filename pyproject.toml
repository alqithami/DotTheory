[project]
name = "dot-trace-theory"
version = "0.44.0"
description = "Dot-Trace Theory reference simulators, synthetic validation scripts, and reproducibility companion materials"
requires-python = ">=3.9"
authors = [
  {name = "alqithami"}
]
readme = "README.md"
license = {text = "License pending"}
keywords = ["multi-agent systems", "memory", "social networks", "collective memory", "agentic social memory", "dynamic graphs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Sociology",
  "Intended Audience :: Science/Research",
]

[project.urls]
Repository = "https://github.com/alqithami/DotTheory"
Documentation = "https://github.com/alqithami/DotTheory/tree/main/docs"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
