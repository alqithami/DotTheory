name: LaTeX build

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/latex-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/latex-build.yml"
  workflow_dispatch:

jobs:
  latex-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether manuscript source is present
        id: paper-source
        run: |
          if [ -f paper/main.tex ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "paper/main.tex is not present. Skipping LaTeX build."
          fi

      - name: Compile LaTeX manuscript
        if: steps.paper-source.outputs.present == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Upload compiled PDF artifact
        if: steps.paper-source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dot-trace-theory-pdf
          path: paper/main.pdf
          if-no-files-found: warn
